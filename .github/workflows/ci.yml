name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-api:
    name: API · Web (Lint · Typecheck · Test · Storybook · E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @ieum/web lint:fsd
      - run: pnpm typecheck
      - run: pnpm test
      # apt 다운로드가 가끔 10분 넘게 멈춥니다. 러너에 있는 라이브러리를 쓰고, 브라우저만 받아 캐시합니다.
      - id: playwright
        run: echo "version=$(pnpm --filter @ieum/web exec playwright --version)" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ieum/web exec playwright install chromium
      - run: pnpm --filter @ieum/web test:storybook
      - run: pnpm test:e2e
      - run: pnpm --filter @ieum/web test:e2e:demo
      # 실패하면 화면과 기록을 내려받아 확인합니다.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  postgres:
    name: API (실제 PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ieum
          POSTGRES_DB: ieum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ieum/api test
        env:
          TEST_DATABASE_URL: postgres://postgres:ieum@localhost:5432/ieum_test

  mobile:
    name: Flutter (Analyze · Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
