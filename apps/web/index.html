<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // 첫 화면부터 고른 테마로 그립니다. mode-store.ts와 같은 규칙이고, 값이 바뀌면 함께 고칩니다.
      (function () {
        var mode;
        try {
          mode = localStorage.getItem('ieum.theme');
        } catch (e) {
          mode = null;
        }
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = mode;
        document.querySelector('meta[name="theme-color"]').content = mode === 'dark' ? '#1b1e25' : '#ffffff';
      })();
    </script>
    <meta name="description" content="나와 너를 잇는 공간, 이음" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>이음</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
