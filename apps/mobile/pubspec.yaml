name: ieum
description: 나와 너를 잇는 공간, 이음
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  get: ^4.7.3
  image_picker: ^1.2.4
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
  fonts:
    - family: Stylish
      fonts:
        - asset: assets/fonts/Stylish-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#c4e538"
  adaptive_icon_foreground: assets/icon/foreground.png

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/splash.png
  color_dark: "#222222"
  image_dark: assets/icon/splash_dark.png
  android_12:
    color: "#ffffff"
    image: assets/icon/splash_android12.png
    color_dark: "#222222"
    image_dark: assets/icon/splash_android12_dark.png
